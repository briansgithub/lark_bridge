[Journal]
# The journal lives in RAM, not on the card.
#
# LARKDATA is the partition the power-loss hardening exists to protect, and a
# power cut can only corrupt a write that is in flight. This appliance runs in a
# car, where power is cut on every engine-off, so the safest journal is one that
# never touches the card at all.
#
# This also removes a real defect rather than working around it. With a
# persistent journal, `journalctl --verify` failed on a *freshly created* journal
# within ~90 minutes -- with no power cut ever performed -- so bridge-storage-guard
# quarantined it and the unit re-entered DEGRADED on every boot. The cause was
# never established (journald, ext4 under commit=1, or the card itself are three
# different investigations). Storing nothing on the card removes the failure class.
#
# Note the base image already ships 40-rpi-volatile-storage.conf with
# Storage=volatile; this drop-in had been overriding it to persistent. Returning
# to volatile is deliberate, not a regression.
Storage=volatile

# Governs under Storage=volatile. 16M against ~900M of RAM on a Pi 3B, which
# leaves ample headroom (measured: 717M available).
RuntimeMaxUse=16M

# Never store debug-level records.
#
# Measured on the converted appliance: rtkit-daemon emits
# "Supervising 0 threads of 0 processes of 0 users." at PRIORITY=7 roughly three
# times a second. That single source was 15374 of 15600 records in a 90 minute
# boot -- 98.6% of all logging -- and drove ~1.7 MB/min of writes while the unit
# sat completely idle. Under Storage=volatile that noise would instead churn RAM
# and evict genuinely useful records against RuntimeMaxUse.
#
# Rate limiting does not help: RateLimitBurst=2000 per 30 s is far above rtkit's
# ~90 records per 30 s, so every message passes the limiter.
MaxLevelStore=info

RateLimitIntervalSec=30s
RateLimitBurst=2000

# Inert while Storage=volatile. Retained so that flipping Storage back to
# persistent restores a bounded configuration rather than systemd's defaults,
# which would let the journal grow until it starved config and pairing recovery.
SystemMaxUse=64M
SystemKeepFree=256M
SystemMaxFileSize=8M
MaxRetentionSec=14day
MaxFileSec=1day
