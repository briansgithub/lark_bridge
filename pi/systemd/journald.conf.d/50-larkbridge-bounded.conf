[Journal]
# LARKDATA is intentionally small. Keep a useful crash window without permitting
# journal growth to starve configuration and pairing recovery data.
Storage=persistent
SystemMaxUse=64M
SystemKeepFree=256M
SystemMaxFileSize=8M
RuntimeMaxUse=16M
MaxRetentionSec=14day
MaxFileSec=1day
Seal=yes
SyncIntervalSec=1m
RateLimitIntervalSec=30s
RateLimitBurst=2000

# Never persist debug-level records to the card.
#
# Measured on the converted appliance: rtkit-daemon emits
# "Supervising 0 threads of 0 processes of 0 users." at PRIORITY=7 roughly three
# times a second. That single source was 15374 of 15600 records in a 90 minute
# boot -- 98.6% of all logging -- and drove ~1.7 MB/min of writes to LARKDATA
# while the unit sat completely idle.
#
# That matters beyond card wear. A power cut can only corrupt a write that is in
# flight, so continuous background writing maximises the exact exposure window
# this hardening exists to shrink. Debug records buy nothing on an appliance that
# ships read-only and is diagnosed over SSH.
#
# Rate limiting does not help here: RateLimitBurst=2000 per 30 s is far above
# rtkit's ~90 records per 30 s, so every message passes the limiter.
MaxLevelStore=info
