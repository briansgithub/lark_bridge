[Journal]
# LARKDATA is intentionally small. Keep a useful crash window without permitting
# journal growth to starve configuration and pairing recovery data.
Storage=persistent
SystemMaxUse=64M
SystemKeepFree=256M
SystemMaxFileSize=8M
RuntimeMaxUse=16M
MaxRetentionSec=14day
MaxFileSec=1day
Seal=yes
SyncIntervalSec=1m
RateLimitIntervalSec=30s
RateLimitBurst=2000
