# rpi-lark-bridge — never route phone audio to the FIFINE K053 monitor jack
#
# The K053 exposes both a mono capture source and a stereo playback sink. LarkBridge uses the
# microphone, but the configured Pi AUX jack must remain the only local playback destination.
# Match the playback node by media class and the K053's hard USB component identity; its generic
# node name is shared with other "USB PnP Audio Device" products and is not a safe identity.
# This rule deliberately does not match Audio/Source, so K053 capture remains available.

monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        alsa.components = "USB0c76:161f"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
