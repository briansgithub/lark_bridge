# rpi-lark-bridge — pin incoming phone media to the fixed AUX output
#
# The configured Pixel's media arrives as an A2DP-source client stream. WirePlumber must retain
# its normal acquisition policy so that playback can bring the transport up, but it
# must not follow whichever sink happens to be the desktop default. E19 measured this
# target property against a decoy default sink and confirmed that media stayed on AUX.
# This release is intentionally fixed to the deployed Pixel MAC. The final numeric node
# suffix is BlueZ enumeration state and must remain wildcarded.

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_input.5C_33_7B_CB_BF_C5.*"
        api.bluez5.profile = "a2dp-source"
        media.class = "Stream/Output/Audio"
      }
    ]
    actions = {
      update-props = {
        target.object = "alsa_output.platform-3f00b840.mailbox.stereo-fallback"
      }
    }
  }
]
