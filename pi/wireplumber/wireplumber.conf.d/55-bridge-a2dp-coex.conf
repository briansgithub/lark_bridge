# rpi-lark-bridge — A2DP survival mitigations for HFP/SCO coexistence
#
# EXPERIMENTAL. Applied as a BUNDLE to test whether A2DP can be made to survive alongside
# an active SCO link (E03). If it works, bisect to find which item actually mattered —
# do not assume all of them are load-bearing.
#
# The measured failure (E03): with SCO active, the A2DP link survives 7 s to 120+ s and
# then our OWN stack disconnects it. HCI shows a host-initiated Disconnect
# ("Connection Terminated By Local Host"), preceded in one capture by bluetoothd logging
# `avdtp.c:cancel_request() Suspend...` then `Abort...`. So an AVDTP command times out and
# bluetoothd gives up. SCO itself is never the casualty — it holds nominal ~135 pps
# throughout.
#
# Each item below targets that mechanism specifically.

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        # (1) Never suspend a Bluetooth device on idle.
        # The teardown sequence begins with an AVDTP *Suspend*. If PipeWire is what
        # initiates that suspend — because the sink briefly looked idle while SCO was
        # hogging the radio — then this removes the trigger entirely rather than making
        # the timeout longer. This is the highest-conviction item in the bundle.
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]

monitor.bluez.properties = {
  # (2) Drop A2DP to 44.1 kHz.
  # ~9% less data on the ACL link, which is pure headroom against the slots eSCO
  # reserves. Costs one resample (48k graph -> 44.1k A2DP) on a path whose quality
  # ceiling is already HFP's 16 kHz, so it is inaudible here.
  bluez5.default.rate = 44100

  # (3) Keep SBC-XQ off (already the default in 50-bridge-bluez.conf, restated because
  # it belongs to this experiment's rationale): XQ raises the ACL duty cycle, which is
  # exactly wrong when competing with eSCO for slots.
  bluez5.enable-sbc-xq = false
}
