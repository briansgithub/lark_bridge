# rpi-lark-bridge — force the Lark to 16-bit to cut USB isochronous load
#
# WHY
# ---
# E07 established that the Bluetooth HCI UART desyncs because its RX FIFO overruns, and that the
# rate scales with USB audio load:
#
#     3 USB audio devices -> desync in 17.2 s
#     1 USB audio device  -> desync in 37 min 3 s
#     0 USB audio devices -> no desync in 228 s
#
# The mechanism: the BT PL011 runs PIO with a 32-byte FIFO (no `dmas` property in the device
# tree), giving ~347 us of slack at 921600 baud, while `dwc_otg_sim-fiq` fires 153 million times
# and a FIQ masks ordinary IRQs. The Lark is full-speed, so its isochronous transfers use split
# transactions — the most FIQ-expensive mode there is.
#
# The Lark cannot be removed; it is the microphone. But it can be made to send fewer bytes.
# From /proc/asound/card1/stream0 it offers two altsettings:
#
#     Altset 1  S24_3LE  2ch 48000   -> 288 bytes per USB frame   (was in use)
#     Altset 2  S16_LE   2ch 48000   -> 192 bytes per USB frame   (this config)
#
# A 33% cut in isochronous payload, for bits that are discarded anyway: the destination is
# 16 kHz mSBC HFP call audio, so 24-bit samples are pure waste on this path.
#
# There is no mono or lower-rate altsetting, so 192 bytes/frame is the floor available by format
# selection alone.
#
# VERIFY, DO NOT ASSUME
# ---------------------
# Setting the property does not prove the altsetting changed. Check the DEVICE, while a stream
# is actually open (nothing is observable when idle):
#
#     cat /proc/asound/card1/stream0        # want: Altset = 2
#     cat /proc/asound/card1/pcm0c/sub0/hw_params   # want: format: S16_LE
#
# **Do NOT expect `Packet Size` to drop to 192.** Both altsettings share endpoint 0x87, whose
# declared wMaxPacketSize is 288, and that is what this field reports — it is the reservation,
# not the transfer. Measured after the change it still reads 288 while `hw_params` reports
# S16_LE, which is the correct and expected result.
#
# Consequence worth being honest about: USB isochronous BANDWIDTH is reserved from
# wMaxPacketSize, so the bus reservation is unchanged. What actually drops is the number of bytes
# moved per frame (192 vs 288) and therefore the complete-split transaction work the dwc_otg FIQ
# has to do. The benefit is real but is not necessarily the full 33%.

monitor.alsa.rules = [
  {
    matches = [
      # Matched on node.name, which derives from USB vendor/product/serial and so survives
      # reboots and replugs — unlike card numbers, which shift as devices come and go.
      { node.name = "alsa_input.usb-Shenzhen_Hollyland_Technology_Co._Ltd_Wireless_Microphone_Wireless_Microphone-01.analog-stereo" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
