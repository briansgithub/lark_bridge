# rpi-lark-bridge — WirePlumber BlueZ monitor configuration
#
# Install to: ~/.config/wireplumber/wireplumber.conf.d/50-bridge-bluez.conf   (user session)
# Applies to: WirePlumber 0.5.x  (Raspberry Pi OS Trixie ships 0.5.8)
#
# ============================================================================
#  bluez5.roles NAMES THE ROLE **WE** PLAY — verified empirically, 2026-08-16
# ============================================================================
# Each value is the role THIS MACHINE takes. Confirmed by setting the value and
# reading back what the adapter advertises in `bluetoothctl show`:
#
#   config value   ->  adapter advertises          ->  meaning
#   a2dp_source    ->  Audio Source   (0000110a)   ->  we send audio to headphones  WANTED
#   a2dp_sink      ->  Audio Sink     (0000110b)   ->  we receive audio from a phone
#   hfp_hf         ->  Handsfree      (0000111e)   ->  we are the hands-free unit   WANTED
#   hfp_ag         ->  Handsfree AG   (0000111f)   ->  we are the audio gateway
#   hsp_hs         ->  Headset        (00001108)   ->  HSP headset role             fallback
#   hsp_ag         ->  Headset AG     (00001112)   ->  HSP gateway role
#
# NOTE: an earlier version of this file claimed the opposite (remote-perspective)
# convention, inferred from spa_bt_profile_from_uuid() in the PipeWire source. That
# inference was WRONG: that function maps a REMOTE device's advertised UUIDs and does
# not govern this config key. The table above is measured, not inferred — trust it.
# ============================================================================

monitor.bluez.properties = {

  # Exactly four roles, all of them roles WE play:
  #  - a2dp_source  we stream audio to the headphones / car stereo
  #  - a2dp_sink    we receive transparent media audio from the Pixel
  #  - hfp_hf       we are the hands-free unit that the Pixel talks to
  #  - hsp_hs       narrowband HSP fallback if HFP proves unstable (spike S2 decides)
  bluez5.roles = [ a2dp_source a2dp_sink hfp_hf hsp_hs ]

  # Native HFP backend. 'ofono' and 'hsphfpd' are not installed and must not be:
  # an installed-but-unconfigured ofono is a documented cause of HFP silently failing.
  bluez5.hfphsp-backend = "native"
  bluez5.hfphsp-backend-native-modem = "none"

  # Wideband speech (16 kHz) instead of CVSD (8 kHz) where the controller and phone
  # agree. This is the single biggest call-quality lever available to us; PLAN.md §5.2
  # calls it the uplink quality ceiling. bridgectl must always report which one is live.
  bluez5.enable-msbc = true

  # Latency and determinism beat fidelity for call audio. SBC-XQ raises the ACL duty
  # cycle, which is exactly the wrong trade when eSCO is competing for slots on the
  # same radio (risk R1). Keep the A2DP stream as small as we can.
  bluez5.enable-sbc-xq = false
  bluez5.codecs = [ sbc ]

  # Force 48 kHz so the graph rate (ADR-0007) passes through A2DP without a resample.
  # If the sink refuses and negotiates 44.1 kHz we accept it and log a WARN rather
  # than reshaping the graph around one device.
  bluez5.default.rate = 48000
  bluez5.default.channels = 2

  # Let the remote's volume keys work.
  bluez5.enable-hw-volume = true

  # The Pi 3B has no PCM/I2S pins wired to the BCM43438, so there is no hardware SCO
  # path to offload to. SCO must ride the HCI transport. See spike S1 and PLAN.md §6.3.
  bluez5.hw-offload-sco = false
}

# ============================================================================
#  SEAT GATING — the setting that makes Bluetooth work at all on a headless Pi
# ============================================================================
# WirePlumber's bluez monitor is gated on the user's logind SEAT being active.
# Over SSH there is no seat, so the monitor script loads and then silently never
# starts: bluez.lua logs "Seat state changed: online" and stops there. The symptom
# is subtle and misleading — the adapter works, bluetoothctl works, wireplumber
# reports active, and the ONLY sign is that no A2DP/HFP UUIDs (0000110a / 0000111e)
# ever appear in `bluetoothctl show`, and no bluez objects appear in `wpctl status`.
#
# This is a PROFILE FEATURE, not a property of the bluez monitor. Putting it inside
# monitor.bluez.properties parses without error and does nothing whatsoever — which
# cost a debugging session here. It must live in wireplumber.profiles.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

wireplumber.settings = {
  # Desktop profile auto-switching is exactly the nondeterminism an appliance must not
  # have. bridged owns profile selection; nothing switches behind its back.
  bluetooth.autoswitch-to-headset-profile = false

  # Remember per-device profile choices across reboots.
  bluetooth.use-persistent-storage = true
}
