# rpi-lark-bridge — keep HFP links under bridge-supervisor ownership
#
# WirePlumber's BlueZ monitor marks HFP transport nodes autoconnect=true before
# applying monitor rules.  On Lark arrival that can briefly connect the raw Lark
# source to the call uplink before bridge-supervisor has built and verified AEC.
# Match only the HFP AG transport presented by the Pixel; A2DP and non-Bluetooth
# nodes retain their normal policy.  The supervisor creates every intended link.

monitor.bluez.rules = [
  {
    matches = [
      { api.bluez5.profile = "headset-audio-gateway" }
    ]
    actions = {
      update-props = {
        node.autoconnect = false
      }
    }
  }
]
