# rpi-lark-bridge — stabilize incoming phone media on the Pi analog AUX sink
#
# E19 measured intermittent bcm2835 output underruns while the clean 44.1 kHz A2DP
# source drove the 48 kHz AUX graph at a 512-frame quantum. The default AUX ALSA
# headroom was one 480-frame period. Adding exactly one more period eliminated new
# AUX ERR increments in the rapid electrical loop without changing Bluetooth or
# graph scheduling. Keep this rule limited to the fixed release output.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-3f00b840.mailbox.stereo-fallback" }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 960
      }
    }
  }
]
