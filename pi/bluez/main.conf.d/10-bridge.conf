# rpi-lark-bridge — BlueZ adapter configuration
#
# Install to: /etc/bluetooth/main.conf.d/10-bridge.conf
# If this BlueZ build does not read main.conf.d, pi/bluez/apply-main-conf.sh merges these
# keys into /etc/bluetooth/main.conf inside a fenced block instead.

[General]

# Class of Device. BlueZ only takes the major and minor device class bits from here; the
# service-class bits are set automatically from the profiles we actually register.
#   0x000408 = major 0x04 (Audio/Video), minor 0b000010 (Hands-free device)
# This is what makes Android's Bluetooth settings show us as a headset rather than as a
# generic computer, which in turn is what makes the "Phone calls" toggle appear.
Class = 0x000408

# BR/EDR only. We have no LE role in this design, and on a single shared radio every LE
# advertising and scanning window is time the controller is not servicing eSCO or A2DP.
# This is one of the coexistence variables measured in stage E (PLAN.md §6.7).
ControllerMode = bredr

# Respond faster to page attempts so the phone reconnects promptly after being out of
# range. Costs a little idle power; irrelevant on a mains-powered appliance.
FastConnectable = true

# Identify clearly in the phone's UI. bridged overrides this per-adapter if the user sets
# a different name in config/bridge.toml.
Name = LarkBridge

[Policy]

# Power the adapter on at boot without anyone logging in.
AutoEnable = true

# BlueZ's own reconnect policy, as a backstop under bridged's recovery ladder (PLAN.md §6.6).
# Exponential intervals so a device that is genuinely gone does not keep the radio busy —
# which matters more than usual here, because that radio is also carrying a call.
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64

# Do not auto-enable the input (HID) profile; we are not a keyboard or mouse host, and
# every profile we do not register is one less thing for Android to get confused by.
