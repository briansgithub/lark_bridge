# rpi-lark-bridge — graph clock and quantum (ADR-0007)
#
# Install to: ~/.config/pipewire/pipewire.conf.d/10-bridge-clock.conf

context.properties = {

  # Fixed 48 kHz. The single-element allowed-rates list is deliberate, not an oversight.
  #
  # In Mode 1 an HFP endpoint (16 kHz) and an A2DP endpoint (48 kHz) are live at the same
  # time, so any dynamic rate switch optimises one by penalising the other — and rate
  # switches glitch both. A fixed rate costs us two resamples at the HFP boundary that no
  # architecture could avoid anyway (HFP *is* a 16 kHz transport), and buys determinism.
  default.clock.rate          = 48000
  default.clock.allowed-rates = [ 48000 ]

  # Quantum. Start conservative: a Pi 3 running BlueZ, two resamplers and an SBC encoder
  # has less headroom than a desktop. 1024/48000 = 21.3 ms.
  #
  # Milestone M8 tunes this DOWNWARD (512, then 256) with XRUN counts as the gate.
  # Do not lower it speculatively — measure, then lower, then soak.
  default.clock.quantum       = 1024
  default.clock.min-quantum   = 256
  default.clock.max-quantum   = 2048

  # Resampler quality. 4 is PipeWire's default and is a good speed/quality trade on ARM.
  # These paths carry 16 kHz-ceilinged voice; spending Pi 3 cycles on a higher-order
  # resampler to polish audio that HFP already band-limited would be pure waste.
  resample.quality            = 4

  # Disable the "peaks" mode used by desktop visualisers. Nothing here has a UI.
  resample.disable            = false

  # Appliance hygiene: no desktop session, no D-Bus-driven device reservation dances.
  # Keep the daemon's own footprint small on a 1 GB machine.
  mem.allow-mlock             = true
  link.max-buffers            = 16
}

context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.*       = support/libspa-support
}
