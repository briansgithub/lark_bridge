# rpi-lark-bridge — Mode 1W audio graph, declared (ADR-0002)
#
# Install to: ~/.config/pipewire/pipewire.conf.d/20-bridge-endpoints.conf
#
#   bridge.mic      Lark  ──► HFP sink       (uplink: your voice to the phone)
#   bridge.callout  HFP source ──► USB DAC   (downlink: call audio to the car aux)
#
# WHY DECLARATIVE, NOT A DAEMON
# ------------------------------
# A loopback node exists whether or not its target does. When the phone disconnects and
# returns — every ignition cycle, every walk out of range — PipeWire reattaches to
# target.object by itself. No daemon sits in the reconnect path, so there is nothing to
# crash, miss an event, or double-link.
#
# The falsifiable consequence, and acceptance criterion 7 in PLAN.md §14:
#     killing the supervisor mid-call MUST NOT interrupt audio.
#
# WHY THE TARGETS ARE HARDCODED
# ------------------------------
# Every name below is deterministic:
#   - bluez nodes derive from the phone's MAC
#   - ALSA nodes derive from USB vendor/product/serial
# They are stable across reboots and replugs, which card numbers and node IDs are not.
# If a device is swapped, these strings change — that is the one maintenance cost, and it
# is preferable to a daemon that has to rediscover them on every event.
#
# HFP nodes exist ONLY while a call is active (measured: the card materialises when SCO
# comes up). Their absence at boot is normal, not a fault.
#
# KNOWN ISSUE — target fallback (unsolved, see docs/BRINGUP-REPORT.md)
# --------------------------------------------------------------------
# The HFP nodes exist ONLY during a call. When they are absent, WirePlumber links these
# streams to the DEFAULT device instead of leaving them waiting. That produces a live
# feedback path: Lark -> callout.playback -> car speakers -> Lark.
#
#  was tried and is WRONG: the streams error out when their
# target is missing at creation and take the whole loopback module down with them.
#
# This needs a small supervisor that creates the loopbacks when a call starts and tears
# them down when it ends -- the transient nature of HFP nodes is what the persistent-
# endpoint design in ADR-0002 did not anticipate.


context.modules = [

  # ---------------------------------------------------------------- microphone uplink
  { name = libpipewire-module-loopback
    args = {
      node.description = "Bridge Microphone Path"
      audio.position = [ MONO ]

      capture.props = {
        node.name        = "bridge.mic.capture"
        node.description = "Bridge Mic (from Lark)"
        media.class      = "Stream/Input/Audio"
        audio.position   = [ MONO ]
        media.role       = "Communication"
        node.pause-on-idle = false
        # The Lark presents 2 channels that are BIT-IDENTICAL (measured, E04): a mono
        # capsule duplicated. Downmixing is harmless but pointless; either channel is
        # the whole signal.
        target.object = "alsa_input.usb-Shenzhen_Hollyland_Technology_Co._Ltd_Wireless_Microphone_Wireless_Microphone-01.analog-stereo"
      }

      playback.props = {
        node.name        = "bridge.mic.playback"
        node.description = "Bridge Mic (to phone uplink)"
        media.class      = "Stream/Output/Audio"
        audio.position   = [ MONO ]
        media.role       = "Communication"
        node.pause-on-idle = false
        # HFP sink = audio going TO the phone. Exists only during a call.
        target.object = "bluez_output.5C_33_7B_CB_BF_C5.1"
      }
    }
  }

  # ---------------------------------------------------------------- call audio downlink
  { name = libpipewire-module-loopback
    args = {
      node.description = "Bridge Call Audio Path"
      audio.position = [ MONO ]

      capture.props = {
        node.name        = "bridge.callout.capture"
        node.description = "Bridge Call Audio (from phone downlink)"
        media.class      = "Stream/Input/Audio"
        audio.position   = [ MONO ]
        media.role       = "Communication"
        node.pause-on-idle = false
        # HFP source = audio coming FROM the phone.
        target.object = "bluez_input.5C_33_7B_CB_BF_C5.0"
      }

      playback.props = {
        node.name        = "bridge.callout.playback"
        node.description = "Bridge Call Audio (to wired output)"
        media.class      = "Stream/Output/Audio"
        audio.position   = [ FL FR ]
        media.role       = "Communication"
        node.pause-on-idle = false
        # Mode 1W: the USB DAC, whose 3.5 mm output feeds the car's aux input.
        # For Mode 1 this would instead be bluez_output.<car-stereo-MAC>.1 — but see
        # E03: A2DP alongside an active call is not currently reliable on this radio.
        target.object = "alsa_output.usb-Generic_AB13X_USB_Audio_202405280846-00.analog-stereo"
      }
    }
  }
]
