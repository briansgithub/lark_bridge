# rpi-lark-bridge — the entire audio graph, declared once (ADR-0002)
#
# Install to: ~/.config/pipewire/pipewire.conf.d/20-bridge-endpoints.conf
#
# These two loopbacks ARE the bridge. Everything else is policy around them.
#
#   bridge.mic      Lark capture  ->  wherever the microphone must go
#                                     Mode 1/1W: the HFP sink (uplink to the Pixel)
#                                     Mode 2:    the I2S playback device (to the Pico)
#
#   bridge.callout  call audio in ->  wherever the call must be heard
#                                     Mode 1:    A2DP sink (headphones/car)
#                                     Mode 1W:   USB DAC or the 3.5 mm jack
#                                     Mode 2:    any selected sink
#
# WHY LOOPBACKS AND NOT pw-link
# -----------------------------
# A loopback node exists whether or not its target exists. When a Bluetooth device
# disconnects and returns, PipeWire reattaches to target.object by itself — no daemon
# sits in the reconnect path, so there is nothing to crash, miss an event, or double-link.
#
# The falsifiable consequence, and an acceptance criterion (PLAN.md §14.7):
#     killing bridged mid-call MUST NOT interrupt audio.
# If it ever does, imperative link management has leaked in. Remove it; do not supervise it.
#
# HOW TARGETS GET SET
# -------------------
# Deliberately NOT hardcoded here — they depend on the mode and on user-specific MACs.
# bridged resolves them from config/bridge.toml and writes them as metadata:
#     pw-metadata -n default <node-id> target.object <node-name>
# Metadata persists for the life of the daemon-less graph, which is what makes the
# "kill bridged, audio continues" property hold.

context.modules = [

  # ---------------------------------------------------------------- microphone path
  { name = libpipewire-module-loopback
    args = {
      node.description = "Bridge Microphone Path"

      # Mono throughout. The Lark is a voice mic, HFP is mono, and a headset mic
      # endpoint is mono — carrying stereo would only invent a channel to throw away.
      audio.position = [ MONO ]

      capture.props = {
        node.name        = "bridge.mic.capture"
        node.description = "Bridge Mic (from Lark)"
        media.class      = "Stream/Input/Audio"
        audio.position   = [ MONO ]
        # If the Lark presents stereo, take a proper downmix rather than one channel:
        # some receivers put the audio on only one side.
        stream.dont-remix = false
        # Never let the source suspend; an appliance mic that sleeps is an appliance
        # that misses the first second of every call.
        node.pause-on-idle = false
        # target.object is set by bridged -> [devices.lark] resolved via udev
      }

      playback.props = {
        node.name        = "bridge.mic.playback"
        node.description = "Bridge Mic (to uplink)"
        media.class      = "Stream/Output/Audio"
        audio.position   = [ MONO ]
        node.pause-on-idle = false
        # Mark this as a communication stream so WirePlumber's policy and any future
        # AEC insertion treat it correctly.
        media.role       = "Communication"
        # target.object is set by bridged:
        #   Mode 1/1W -> bluez_output.<PHONE_MAC>.handsfree-head-unit
        #   Mode 2    -> alsa_output.<i2s-card>  (the "to-pico" direction)
      }
    }
  }

  # ---------------------------------------------------------------- call audio path
  { name = libpipewire-module-loopback
    args = {
      node.description = "Bridge Call Audio Path"
      audio.position = [ MONO ]

      capture.props = {
        node.name        = "bridge.callout.capture"
        node.description = "Bridge Call Audio (from downlink)"
        media.class      = "Stream/Input/Audio"
        audio.position   = [ MONO ]
        node.pause-on-idle = false
        media.role       = "Communication"
        # target.object is set by bridged:
        #   Mode 1/1W -> bluez_input.<PHONE_MAC>.handsfree-head-unit
        #   Mode 2    -> alsa_input.<i2s-card>  (the "from-pico" direction)
      }

      playback.props = {
        node.name        = "bridge.callout.playback"
        node.description = "Bridge Call Audio (to output)"
        media.class      = "Stream/Output/Audio"
        # Most sinks want stereo; duplicate the mono call audio to both channels.
        audio.position   = [ FL FR ]
        node.pause-on-idle = false
        media.role       = "Communication"
        # target.object is set by bridged:
        #   Mode 1  -> bluez_output.<SINK_MAC>.a2dp-sink
        #   Mode 1W -> alsa_output.<usb-dac>  or the 3.5 mm jack
        #
        # THE MODE 1 <-> MODE 1W DIFFERENCE IS THIS ONE STRING. That is the whole
        # payoff of ADR-0001 + ADR-0002: the riskiest architectural choice in the
        # project is a runtime metadata write, not a redesign.
      }
    }
  }

  # ---------------------------------------------------------------- diagnostic tap
  # Disabled by default. Enabled on demand by `bridgectl tap start`, which is
  # deliberately explicit and time-boxed: recording call audio has consent and legal
  # implications that vary by jurisdiction (PLAN.md §15 Q5).
  #
  # { name = libpipewire-module-loopback
  #   args = {
  #     node.description = "Bridge Diagnostic Tap"
  #     capture.props  = { node.name = "bridge.tap.capture"  media.class = "Stream/Input/Audio" }
  #     playback.props = { node.name = "bridge.tap.sink"     media.class = "Audio/Sink" }
  #   }
  # }
]
