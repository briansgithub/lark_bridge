[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "larkbridge-control"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["black", "mypy", "pytest", "ruff"]

[tool.setuptools]
py-modules = ["bridge_supervisor", "bt_watchdog"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
