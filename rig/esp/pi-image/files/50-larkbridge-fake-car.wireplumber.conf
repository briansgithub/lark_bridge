# larkbridge-rig: WirePlumber 0.5 config for the FAKE CAR (rig Pi only, never the product).
#
# Install to: /etc/wireplumber/wireplumber.conf.d/50-larkbridge-fake-car.conf
#
# bluez5.roles names the role THIS machine plays (measured on the product Pi, see
# pi/wireplumber/wireplumber.conf.d/50-bridge-bluez.conf). The fake car only RECEIVES media:
# a2dp_sink. With no HFP/HSP, the 32UE cannot open a call path to the rig. AVRCP CT is not a
# PipeWire role: bluetoothd's avrcp plugin registers the controller record itself, and
# fake-car.sh drives it over D-Bus.

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
  bluez5.hfphsp-backend = "none"

  # The ESP32 classic A2DP source speaks SBC. Offering only SBC keeps the negotiated
  # codec deterministic across runs.
  bluez5.codecs = [ sbc ]

  # Ignore AVRCP absolute volume from the source: the recording must stay unscaled, so a
  # level change in a capture is a DUT fact, not a volume message.
  bluez5.enable-hw-volume = false
}

# Headless: the rig user has no active logind seat, and with seat monitoring on, the
# BlueZ monitor never starts.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

# Received media arrives as a Stream/Output/Audio node named bluez_input.<MAC>.<N>. Left to
# the default policy, it would play out of the default sink, which on the rig is the C-Media
# dongle driving the INSTRUMENT speaker. Pin it to the silent recording tap instead. That
# link is also what makes WirePlumber acquire the A2DP transport.
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_input.*"
        media.class = "Stream/Output/Audio"
      }
    ]
    actions = {
      update-props = {
        target.object = "larkbridge_fake_car"
      }
    }
  }
]
