# larkbridge-rig: SSH key authentication only (rig Pi only).
# Install to: /etc/ssh/sshd_config.d/10-larkbridge-rig.conf
# sshd keeps the FIRST value it reads for each keyword, and sshd_config includes this
# directory before its own settings, so these win.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
