# larkbridge-rig: the fake car's silent recording tap (rig Pi only).
#
# Install to: /etc/pipewire/pipewire.conf.d/50-larkbridge-fake-car.conf
#
# A null sink that the received A2DP stream is routed to (see the WirePlumber rule). It
# plays nowhere. `fake-car.sh record` captures its monitor ports.
context.objects = [
  {
    factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "larkbridge_fake_car"
      node.description = "LarkBridge fake car (recording tap)"
      media.class      = "Audio/Sink"
      audio.position   = [ FL FR ]
      audio.rate       = 48000
    }
  }
]
