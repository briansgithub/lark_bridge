# LarkBridge ESP32 gate registry, read by rig/esp/hil.py.
#
# See firmware/docs/qualification-matrix.md for the gate definitions.
# Automated measurement thresholds are recorded with the gate.
#
#   tier     T0 host test · T1 build · T2 smoke on hardware · T3 rig-automated
#            · T4 acoustic/real-peer fixture · T5 car/person
#   needs    gates that must be PASS first
#   human    true when a person must act (see firmware/qual/human-queue.md)
#   resets   true when running the gate resets or reflashes a board
#   status   last recorded verdict: PENDING | PASS | FAIL | PARTIAL; evidence
#            names the result directory or record
#   reducer  hil.py reducer; "manual" gates are recorded with arrival.py

schema = 1

