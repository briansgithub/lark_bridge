name: lint

on:
  push:
  pull_request:

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shellcheck -x -S warning

      # CRLF in a script that runs on the Pi produces "bad interpreter: /bin/bash^M",
      # which is a confusing way to lose an hour. .gitattributes forces LF; this proves it.
      - name: Reject CRLF in files the Pi executes or parses
        run: |
          bad=$(find . \( -name '*.sh' -o -name '*.service' -o -name '*.conf' \
                          -o -name '*.rules' -o -name '*.dts' \) \
                -not -path './.git/*' -exec file {} + | grep -i 'CRLF' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "ERROR: CRLF line endings found"; exit 1; fi

  python:
    name: ruff + black + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install ruff black mypy

      # tools/ must stay importable with a bare stdlib Python: these scripts run on the Pi
      # during provisioning, before the project virtualenv exists.
      - name: Byte-compile stdlib-only tools
        run: python -m compileall -q tools/ pi/powerloss/ rig/powerloss/ scripts/powerloss/

      - name: Power-loss host tests
        run: |
          python -m unittest discover -s pi/powerloss/tests -p 'test_*.py'
          python -m unittest discover -s rig/powerloss/tests -p 'test_*.py'
          python -m unittest discover -s scripts/powerloss/tests -p 'test_*.py'

      - name: Assert tools/ imports nothing outside the stdlib
        run: |
          if grep -rnE '^\s*(import|from)\s+(numpy|scipy|dbus_fast|click|rich)' tools/; then
            echo "ERROR: tools/ must be stdlib-only — it runs before the venv exists"; exit 1
          fi

      - name: ruff
        run: ruff check tools/ tests/ pi/ || true   # advisory until pi/bridged/ lands (M7)
      - name: black
        run: black --check --diff tools/ tests/ || true

  devicetree:
    name: device-tree overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dtc
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - name: Compile overlays
        run: |
          shopt -s nullglob
          for f in pi/boot/overlays/*.dts; do
            echo "== $f"
            dtc -@ -I dts -O dtb -o /dev/null "$f"
          done

  docs:
    name: doc consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ADRs and PLAN.md are the contract. If a doc references an ADR that does not
      # exist, the contract has drifted and the next agent will act on a phantom decision.
      - name: Every referenced ADR exists
        run: |
          missing=0
          for ref in $(grep -rhoE 'ADR-[0-9]{4}' --include='*.md' . | sort -u); do
            if ! ls docs/architecture/decisions/${ref}-*.md >/dev/null 2>&1; then
              echo "MISSING: $ref is referenced but has no file"; missing=1
            fi
          done
          exit $missing

      - name: Every experiment referenced by a spike script exists
        run: |
          missing=0
          for ref in $(grep -rhoE 'E[0-9]{2}-[a-z0-9-]+\.md' --include='*.sh' --include='*.md' . | sort -u); do
            if [ ! -f "docs/experiments/$ref" ]; then
              echo "MISSING: docs/experiments/$ref"; missing=1
            fi
          done
          exit $missing
