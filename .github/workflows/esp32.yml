name: ESP32 port

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/esp32.yml"
      - "Makefile"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/esp32.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  host:
    name: Portable core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build and test portable C core
        run: python3 firmware/tools/build_firmware.py host
      - name: Test build tooling
        run: python3 -m unittest discover -s firmware/tools/tests -p 'test_*.py'

  output:
    name: ESP32 output / IDF v6.0.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact output target
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32
          path: firmware/output
          command: >-
            test "$(git -C "$IDF_PATH" rev-parse HEAD)" =
            "7101770dc6db2667b3c477cc31365dd1acd6db4e" &&
            idf.py set-target esp32 && idf.py build && idf.py size &&
            python ../tools/build_manifest.py output
      - name: Archive flash bundle
        uses: actions/upload-artifact@v4
        with:
          name: larkbridge-output-esp32
          if-no-files-found: error
          path: |
            firmware/output/build/**/*.bin
            firmware/output/build/*.elf
            firmware/output/build/*.map
            firmware/output/build/flasher_args.json
            firmware/output/build/flash_args
            firmware/output/build/config/sdkconfig.h
            firmware/output/build/larkbridge-build-manifest.json
            firmware/output/sdkconfig
            firmware/output/dependencies.lock
            firmware/toolchain.lock.json

  s31:
    name: ESP32-S31 gateway / IDF v6.1-rc1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact preview target
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1-rc1
          target: esp32s31
          path: firmware/s31
          command: >-
            test "$(git -C "$IDF_PATH" rev-parse HEAD)" =
            "44f0c59f7c81a72a5868a52d5f6dfbbf88829704" &&
            idf.py --preview set-target esp32s31 && idf.py build && idf.py size &&
            python ../tools/build_manifest.py s31
      - name: Archive flash bundle
        uses: actions/upload-artifact@v4
        with:
          name: larkbridge-s31-gateway
          if-no-files-found: error
          path: |
            firmware/s31/build/**/*.bin
            firmware/s31/build/*.elf
            firmware/s31/build/*.map
            firmware/s31/build/flasher_args.json
            firmware/s31/build/flash_args
            firmware/s31/build/config/sdkconfig.h
            firmware/s31/build/larkbridge-build-manifest.json
            firmware/s31/sdkconfig
            firmware/s31/dependencies.lock
            firmware/toolchain.lock.json
